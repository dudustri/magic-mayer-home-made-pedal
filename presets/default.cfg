# Pedal settings: "name = value", one per line. Used by ./sim and ./tuner.
# Anything left out keeps the default from pedal.h.
# Front-panel knobs (0-10) first: they set the circuit parameters. Circuit lines after them override.

# --- Tube Screamer (TS808 / TS9) ---
tsOn = 1
tsDriveKnob = 7    # DRIVE
tsToneKnob = 5     # TONE
tsLevelKnob = 6    # LEVEL
tsHpHz = 720       # circuit: frequencies above this get clipped (the mid hump)

# --- Klon Centaur ---
klonOn = 0
klGainKnob = 5     # GAIN: more drive and more dirty in the clean/dirty mix
klTrebleKnob = 5   # TREBLE
klOutputKnob = 6   # OUTPUT
klClip = 0.35      # circuit: germanium diode threshold (lower = more grit)
klBpHz = 400       # circuit: lows below this skip the clipper
klTrebleHz = 1000  # circuit: treble shelf corner

# --- Keeley Katana ---
katanaOn = 0
kaVolumeKnob = 5   # VOLUME
kaDirty = 0        # push/pull: 0 = clean boost, 1 = dirty boost
kaBright = 1.3     # circuit: treble tilt (1 = flat)
kaShelfHz = 3000   # circuit: tilt corner
