<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="title">TS808 clipping stage</title>
<desc id="desc">Non-inverting op-amp stage, first half of the JRC4558. Plus input from the input buffer. Minus input to Vref through 4.7 kilohm and 47 nanofarad, a high-pass at about 720 hertz that makes the mid hump. Feedback from output to minus input: 51 kilohm in series with the 500 kilohm DRIVE pot, in parallel with 51 picofarad and two 1N914 diodes in opposite directions. Gain 12 to 118.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="40" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2937">TS808 clipping stage</text>
<text x="30" y="64" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">The heart of the Tube Screamer. Gain = 1 + (51k + DRIVE) / 4.7k = about 12x to 118x.</text>
