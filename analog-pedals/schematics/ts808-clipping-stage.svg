<text x="298" y="369.0" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">47 nF</text>
<polyline points="280,327.0 280,342.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<polyline points="280,372.0 280,382.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<rect x="233.0" y="382.0" width="94" height="20" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="280.0" y="396.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">Vref 4.5 V</text>
<circle cx="580" cy="350.0" r="3.5" fill="#8a3fb0"/>
<polyline points="520,350.0 640,350.0" fill="none" stroke="#8a3fb0" stroke-width="2" stroke-linejoin="round"/>
