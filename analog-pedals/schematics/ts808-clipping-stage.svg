<text x="426" y="332.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">−</text>
<text x="426" y="376.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">+</text>
<text x="414" y="322.0" font-size="11" text-anchor="end" font-weight="normal" fill="#6b7280">2</text>
<text x="414" y="366.0" font-size="11" text-anchor="end" font-weight="normal" fill="#6b7280">3</text>
<text x="524" y="343.0" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280">1</text>
<text x="420" y="292" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">U1A  JRC4558</text>
