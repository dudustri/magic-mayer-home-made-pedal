<text x="600" y="122" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">D1, D2 1N914, opposite directions</text>
<text x="620" y="400" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">4.7 kΩ + 47 nF: high-pass at about 720 Hz = the mid hump</text>
<text x="620" y="418" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">51 kΩ + DRIVE: sets the gain</text>
<text x="620" y="436" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">51 pF: cuts high-frequency fizz</text>
<text x="620" y="454" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">Two diodes, opposite directions: soft, symmetric clipping</text>
