<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="title">Digital pedal overview</title>
<desc id="desc">Guitar into a TL072 buffer, PCM1808 ADC, ESP32 running pedal.h (Tube Screamer, Klon, Katana), PCM5102A DAC, master volume, amp. Seven pots, a pull switch and three footswitches tell the ESP32 the knob settings.</desc>
