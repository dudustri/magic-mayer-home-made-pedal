<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" width="1180" height="360" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="title">Digital pedal overview</title>
<desc id="desc">Guitar cable into a TL072 buffer and PCM1808 ADC, or the wireless transmitter into the nRF24 radio. Both reach the ESP32-S3 running pedal.h (Tube Screamer, Klon, Katana), then the PCM5102A DAC, master volume and amp. Seven pots, a pull switch and three footswitches set the knobs. With all effects off the clean sound passes through.</desc>
