<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 640" width="1560" height="640" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="title">Receiver, option B: XIAO ESP32-C3 + nRF24L01+</title>
<desc id="desc">Same as option A receiver, with the XIAO ESP32-C3 as I2S master giving 12.288 MHz MCLK, and an nRF24L01+ radio on SPI: XIAO D10 to MOSI, D9 to MISO, D8 to SCK, D7 to CSN with a 10 kilohm pull-up to 3V3, D6 to CE. 10 microfarad and 100 nanofarad capacitors on the nRF24 power pins. Pins drawn in the XIAO&#x27;s real order: D0 to D6 on one side; 5V, GND, 3V3, D10 to D7 on the other; battery pads underneath. Labels with the same name (3V3, Vref, CE) are connected.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="40" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2937">Receiver, option B: XIAO ESP32-C3 + nRF24L01+</text>
<text x="30" y="64" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">XIAO ESP32-C3 is the I2S clock master (12.288 MHz MCLK on D0). No status LED: status over USB serial.</text>
