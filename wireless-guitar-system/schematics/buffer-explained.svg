<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="title">How the transmitter input buffer works</title>
<desc id="desc">MCP6002 voltage follower. Point 1, the guitar tip: a small wave of about plus and minus 0.5 volt around 0 volt. C1 blocks DC and R2 lifts the wave to Vref, 1.65 volt, half of the 3.3 volt supply, so the op-amp on a single supply can follow both halves; point 2. The op-amp output is wired back to its minus input, so it copies its plus input with a gain of 1 but can drive the WM8960. C3 removes the 1.65 volt again; point 3, the same wave around 0 volt. R1 keeps the input at 0 volt when nothing is plugged in. R3 and R4 divide 3.3 volt into Vref, C2 keeps it quiet. The unused second half of the chip is parked as a follower on Vref.</desc>
