<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 700" width="1640" height="700" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="title">Receiver: ESP32-S3 + nRF24L01+</title>
<desc id="desc">ESP32-S3 DevKitC-1 powered over USB-C. nRF24L01+ on SPI: GPIO39 CE, GPIO40 CSN, GPIO41 SCK, GPIO42 MOSI, GPIO47 MISO, with 10 microfarad and 100 nanofarad capacitors on its power pins. WM8960: GPIO14 MCLK, GPIO13 BCLK, GPIO12 LRCK, GPIO11 to DACDAT, GPIO8 SDA, GPIO9 SCL. WM8960 HP_L and HP_R through 47 ohm resistors to the 3.5 mm jack J3 tip and ring and, from HP_L, to the 6.35 mm jack J2 tip. Headphone ground to both sleeves.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="40" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2937">Receiver: ESP32-S3 + nRF24L01+</text>
<text x="30" y="64" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">ESP32-S3 is the I2S clock master (12.288 MHz MCLK on GPIO14). Powered from its USB-C port. Later it becomes the digital pedal.</text>
