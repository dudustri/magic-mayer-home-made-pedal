<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 250" width="1180" height="250" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="title">Wireless guitar system overview</title>
<desc id="desc">Guitar, then the transmitter: buffer, WM8960 ADC, XIAO with radio. Radio link at 2.4 GHz. Receiver: XIAO with radio, WM8960 DAC and headphone amp, then a 3.5 mm plug to headphones or a line input, or through an adapter to a 6.35 mm amp input.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="90" width="120" height="64" rx="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="2"/>
<text x="80" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Guitar</text>
<text x="80" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">pickups</text>
<rect x="200" y="90" width="120" height="64" rx="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="2"/>
<text x="260" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Buffer</text>
<text x="260" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">MCP6002</text>
<rect x="340" y="90" width="120" height="64" rx="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="2"/>
<text x="400" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">ADC</text>
<text x="400" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">WM8960</text>
<rect x="480" y="90" width="120" height="64" rx="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="2"/>
<text x="540" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Radio</text>
<text x="540" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">XIAO</text>
<rect x="700" y="90" width="120" height="64" rx="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="2"/>
<text x="760" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Radio</text>
<text x="760" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">XIAO</text>
<rect x="840" y="90" width="120" height="64" rx="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="2"/>
<text x="900" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">DAC + amp</text>
<text x="900" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">WM8960</text>
<rect x="980" y="90" width="120" height="64" rx="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="2"/>
<text x="1040" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Output</text>
<text x="1040" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">3.5 mm plug</text>
