<path d="M640 86 A36 36 0 0 1 640 158" stroke="#2563a8" stroke-width="2" fill="none"/>
<text x="650" y="200" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">2.4 GHz, about 4-5 ms</text>
<rect x="185" y="70" width="430" height="104" rx="10" fill="none" stroke="#6b7280" stroke-dasharray="6 5"/>
